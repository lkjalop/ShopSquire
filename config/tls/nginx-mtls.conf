server {
  listen 443 ssl;
  server_name api.local;

  ssl_certificate /etc/nginx/tls/server.crt;
  ssl_certificate_key /etc/nginx/tls/server.key;
  ssl_client_certificate /etc/nginx/tls/ca.crt;
  ssl_verify_client on;
  ssl_verify_depth 2;

  # Fail closed at ingress when mutual TLS verification is not successful.
  if ($ssl_client_verify != SUCCESS) {
    return 495;
  }

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # Forward trusted TLS fingerprints generated by upstream edge proxy (Envoy/Nginx module).
    # App-side middleware accepts these only from trusted proxy CIDRs.
    proxy_set_header X-JA3-Hash $http_x_ja3_hash;
    proxy_set_header X-JA4-Hash $http_x_ja4_hash;
    proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
    proxy_set_header X-SSL-Client-Fingerprint $ssl_client_fingerprint;
    proxy_set_header X-Forwarded-Client-Cert $ssl_client_escaped_cert;
    proxy_pass http://api:8080;
  }
}

server {
  listen 444 ssl;
  server_name grafana.local;
  ssl_certificate /etc/nginx/tls/server.crt;
  ssl_certificate_key /etc/nginx/tls/server.key;

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://grafana:3000;
  }
}

server {
  listen 445 ssl;
  server_name prometheus.local;
  ssl_certificate /etc/nginx/tls/server.crt;
  ssl_certificate_key /etc/nginx/tls/server.key;

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://prometheus:9090;
  }
}

