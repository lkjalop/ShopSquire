# Example Nginx edge config for in-proxy JA3/JA4 extraction.
# Requires an Nginx build/module that exposes JA3/JA4 variables, e.g.:
#   - $ja3_hash
#   - $ja4_hash
#
# If your module uses different variable names, update proxy_set_header lines.

server {
  listen 443 ssl;
  server_name edge.local;

  ssl_certificate /etc/nginx/tls/server.crt;
  ssl_certificate_key /etc/nginx/tls/server.key;

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # True edge extraction: values come from this edge Nginx module, not caller headers.
    proxy_set_header X-JA3-Hash $ja3_hash;
    proxy_set_header X-JA4-Hash $ja4_hash;

    proxy_pass http://shopsquire_ingress:443;
  }
}
