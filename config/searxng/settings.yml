use_default_settings:
  engines:
    # Keep the demo provider bounded to engines that currently return
    # server-side results from this deployment. Authority is still decided by
    # the source workflow, never by an engine or snippet.
    keep_only:
      - privacywall
      - yandex

server:
  limiter: false
  secret_key: "shopsquire-local-certification-not-for-production"

search:
  safe_search: 1
  formats:
    - html
    - json

outgoing:
  # The caller permits four seconds per query. Return partial engine results
  # before that boundary instead of letting the caller discard the response.
  request_timeout: 3.2
  max_request_timeout: 3.6

# The local certification profile deliberately uses engines that currently
# return server-side results without browser CAPTCHA challenges. Discovery is
# still best-effort; official-origin fetches remain the authority boundary.
engines:
  - name: privacywall
    disabled: false
  - name: yandex
    disabled: false
