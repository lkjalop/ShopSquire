# Agent Policy (Policy-as-Code) — ShopSquire
# Define allowed actions, approval requirements, data scopes, and guardrails per agent role.

version: 1
roles:
  detection_agent:
    description: "Analyzes inputs (email/web/connector) and emits findings; no direct state changes."
    allowed_actions:
      - emit_security_event
      - quarantine_request
      - annotate_evidence
    playbook_action_types:
      - block_request
      - notify_ops
      - log_incident
      - quarantine_session
      - flag_for_review
      - ip_block
      - rate_limit
      - log_cv_event
      - request_manual_review
      - create_ticket
      - create_incident
      - escalate_ticket
      - step_up_auth
      - session_revoke
      - suspend_account
    approvals_required: []
    data_scope:
      - pii_min
      - telemetry
    rate_limits:
      per_minute: 600
      burst: 100
    abac_conditions:
      ip_allowlist: []
      time_window: "00:00-23:59"
      min_trust_score: 0.30

  email_agent:
    description: "Handles email-specific workflows (classification, quarantine suggestions)."
    allowed_actions:
      - recommend_quarantine
      - release_request
      - update_email_policy
    playbook_action_types:
      - quarantine_email
      - block_sender
      - release_email
      - notify_ops
      - sandbox_attachment
      - log_incident
      - disable_auto_financial_changes
      - human_review
      - create_ticket
      - create_incident
    approvals_required:
      - release_high_severity
    data_scope:
      - pii_min
      - headers
    constraints:
      - no_send_external
    rate_limits:
      per_minute: 240
      burst: 40
    abac_conditions:
      ip_allowlist: []
      time_window: "00:00-23:59"
      min_trust_score: 0.35

  supplier_agent:
    description: "Interacts with supplier data (onboarding, updates) via safe APIs."
    allowed_actions:
      - suggest_update
      - flag_anomaly
      - request_verification
    playbook_action_types:
      - notify_ops
      - log_incident
      - flag_for_review
      - request_manual_review
      - create_ticket
    approvals_required:
      - critical_profile_change
    data_scope:
      - supplier_profile
      - audit_logs
    rate_limits:
      per_minute: 180
      burst: 30
    abac_conditions:
      ip_allowlist: []
      time_window: "00:00-23:59"
      min_trust_score: 0.30

  payments_agent:
    description: "Engages with payment workflows under strict controls."
    allowed_actions:
      - prepare_disbursement
      - verify_beneficiary
      - hold_payment
    playbook_action_types:
      - hold_payment
      - block_transaction
      - verify_beneficiary
      - notify_ops
      - create_incident
      - log_incident
      - apply_compensation
      - offer_discount
      - create_ticket
    approvals_required:
      - any_disbursement
      - beneficiary_change
    data_scope:
      - finance_min
      - audit_logs
    rate_limits:
      per_minute: 120
      burst: 20
    abac_conditions:
      ip_allowlist: []
      time_window: "00:00-23:59"
      min_trust_score: 0.45

severities:
  low:
    auto_actions:
      - log_only
  medium:
    auto_actions:
      - quarantine_if_email
      - require_soft_approval
  high:
    auto_actions: []
    required_human_approvals: 1
  critical:
    auto_actions: []
    required_human_approvals: 2

constraints:
  prompt_sanitization: true
  pii_redaction: true
  external_calls_allowed: false
  allowed_domains:
    - shopsquire.local
    - api.shopsquire.example

backpressure:
  enabled: true
  max_concurrent_actions: 10
  retry_strategy:
    type: exponential_backoff
    max_retries: 5
    base_delay_ms: 200

audit:
  evidence_required: true
  fields:
    - inputs_hash
    - policy_version
    - rationale
    - approvals
