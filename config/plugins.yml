agents:
  InventoryAgent: "src.app.services.inventory_agent:create_agent"
  RecommendationAgent: "src.app.services.recommendations:create_agent"

tools:
  catalog.search:
    ref: "src.app.tools.catalog:search"
    description: "Search product catalog by query keywords."
    risk: "low"
    agent_types: ["orchestrator", "recommendations"]
  cv_forensics_check:
    ref: "src.app.services.image_forensics:run_forensics"
    description: "Run image forensics checks."
    risk: "high"
    agent_types: ["cv", "orchestrator"]
