<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — Interleaving Summary</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 20px; }
    .row { display:flex; gap:8px; align-items:center; margin-bottom:12px }
    label { min-width:90px }
    #result { white-space:pre-wrap; background:#f7f7f7; padding:12px; border:1px solid #eee }
    canvas { max-width:800px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/static/admin_interleaving.js"></script>
</head>
<body>
  <h2>Interleaving Summary (Admin)</h2>
  <div class="row">
    <label>Trace ID</label>
    <input id="traceId" type="text" placeholder="demo-trace-1" style="flex:1" />
  </div>
  <div class="row">
    <label>API Key</label>
    <input id="apiKey" type="text" placeholder="local-developer-key" style="flex:1" />
  </div>
  <div class="row">
    <button id="fetchBtn">Fetch Summary</button>
    <button id="sampleBtn">Load Sample</button>
  </div>

  <h3>Summary</h3>
  <div id="summaryGrid"></div>

  <h3>Visualization</h3>
  <div style="display:flex;flex-direction:column;gap:12px;align-items:flex-start">
    <canvas id="chart" width="800" height="240"></canvas>
    <canvas id="stackedChart" width="800" height="240"></canvas>
    <div style="display:flex;gap:16px;align-items:center">
      <div>
        <h4 style="margin:6px 0">Tags Heatmap</h4>
        <canvas id="heatmap" width="600" height="160" style="border:1px solid #eee"></canvas>
      </div>
      <div id="heatmapLegend" style="font-size:12px;color:#444"></div>
    </div>
  </div>

  <h3>Raw</h3>
  <div id="result">No data loaded</div>

</body>
</html>
