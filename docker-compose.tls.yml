version: "3.9"
services:
  nginx:
    image: nginx:1.25-alpine
    container_name: shopsquire-nginx
    ports:
      - "443:443"
    volumes:
      - ./config/observability/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/tls:/etc/nginx/tls:ro
    depends_on:
      - api
      - prometheus
      - grafana
    networks:
      - internal

  api:
    networks:
      - internal
  prometheus:
    networks:
      - internal
    expose:
      - "9090"
  grafana:
    networks:
      - internal
    expose:
      - "3000"

networks:
  internal:
    driver: bridge
