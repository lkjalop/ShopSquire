version: "3.9"
services:
  nginx:
    image: nginx:1.25-alpine
    container_name: shopsquire-nginx
    ports:
      - "443:443"
      - "444:444"
      - "445:445"
    volumes:
      - ./config/tls/nginx-mtls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/tls:/etc/nginx/tls:ro
    depends_on:
      - api
      - prometheus
      - grafana
    networks:
      - internal

  api:
    environment:
      INTERNAL_MTLS_REQUIRED: "1"
    networks:
      - internal
  prometheus:
    networks:
      - internal
    expose:
      - "9090"
  grafana:
    networks:
      - internal
    expose:
      - "3000"

networks:
  internal:
    driver: bridge
