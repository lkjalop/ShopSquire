version: "3.9"
services:
  nginx:
    image: nginx:1.25-alpine
    container_name: shopsquire-nginx
    ports:
      - "443:443"
      - "444:444"
      - "445:445"
    volumes:
      - ./config/tls/nginx-mtls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/tls:/etc/nginx/tls:ro
      - ./config/tls/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - prometheus
      - grafana
    networks:
      - internal

  api:
    environment:
      INTERNAL_MTLS_REQUIRED: "1"
      INTERNAL_MTLS_FAIL_CLOSED: "1"
      INTERNAL_MTLS_TRUSTED_PROXY_CIDRS: "172.16.0.0/12,10.0.0.0/8,127.0.0.1/32"
      INTERNAL_MTLS_PATH_PREFIXES: "/api/v1/orchestrator/events,/api/v1/webhooks,/api/v1/ingest,/api/v1/admin"
      MTLS_CERT_MONITOR_ENABLED: "1"
      MTLS_CERT_DIR: "/app/certs"
    volumes:
      - ./config/tls/certs:/app/certs:ro
    networks:
      - internal

  sync-worker:
    environment:
      INTERNAL_MTLS_REQUIRED: "1"
    volumes:
      - ./config/tls/certs:/app/certs:ro
    networks:
      - internal

  prometheus:
    networks:
      - internal
    expose:
      - "9090"
  grafana:
    networks:
      - internal
    expose:
      - "3000"

networks:
  internal:
    driver: bridge
