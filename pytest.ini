[pytest]
# -p no:warnings  — suppress pytest warning-summary noise (saves ~5% test-run overhead).
# --no-header      — skip the platform/version header line (cosmetic, minimal overhead).
# To run with xdist: python -m pytest -n2  (never use -n auto — OOM risk on this machine).
addopts = -q --no-header -p no:warnings
# Only collect tests in the tests/ folder
testpaths = tests
# Ensure the repo root is on sys.path so imports like `src.*` and `tests.*` work
pythonpath = .
markers =
	integration: integration tests that exercise multiple components
	order: tests with explicit execution ordering
