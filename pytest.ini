[pytest]
# -p no:warnings  — suppress pytest warning-summary noise (saves ~5% test-run overhead).
# --no-header      — skip the platform/version header line (cosmetic, minimal overhead).
# To run with xdist: python -m pytest -n2  (never use -n auto — OOM risk on this machine).
addopts = -q --no-header -p no:warnings --durations=25 --durations-min=1.0
timeout = 180
timeout_method = thread
faulthandler_timeout = 120
# Only collect tests in the tests/ folder
testpaths = tests
# Ensure the repo root is on sys.path so imports like `src.*` and `tests.*` work
pythonpath = .
markers =
	protocol: provider-independent contract and policy tests; no external system claim
	certification: tests against a pinned provider or product certification target
	frozen_characterization: preserved historical behavior from a retired boundary; not an active V2 contract
	sandbox: tests requiring a provider sandbox or emulator
	live_provider: tests requiring live external credentials and network services
	integration: integration tests that exercise multiple components
	order: tests with explicit execution ordering
	slow: tests that are slow (CV model loading, large image inference, etc.) — skipped by default in CI
