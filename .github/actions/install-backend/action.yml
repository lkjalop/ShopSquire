name: Install locked backend
description: Install a committed backend profile in the selected Python.
inputs:
  profile:
    description: default (complete Poetry development) or api-test (exported API and test profile)
    default: default
    required: false
runs:
  using: composite
  steps:
    - name: Install pinned dependency tooling
      shell: bash
      run: |
        python -m pip install -r requirements/bootstrap-runtime.txt
        python -m pip install poetry==2.4.1
    - name: Install the committed lock including test tools
      shell: bash
      env:
        SHOPSQUIRE_BACKEND_PROFILE: ${{ inputs.profile }}
      run: |
        poetry config virtualenvs.create false
        poetry check --lock
        case "$SHOPSQUIRE_BACKEND_PROFILE" in
          default) poetry install --no-interaction --no-ansi --no-root ;;
          api-test) python -m pip install -r requirements/api-runtime.txt -r requirements/test-runtime.txt ;;
          *) echo "Unsupported committed backend profile" >&2; exit 2 ;;
        esac
        python -m pip check
