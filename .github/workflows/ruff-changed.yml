name: Ruff changed-file ratchet

on:
  pull_request:

jobs:
  changed-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff>=0.3,<0.4"
      - name: Check changed Python files only
        # This publication PR intentionally establishes the accumulated V2
        # checkpoint as the legacy lint baseline. Every Python file changed
        # after that reviewed checkpoint must be clean; repository-wide debt
        # remains reported separately and is not represented as green here.
        run: >-
          python scripts/ci_ruff_changed.py
          --base "c76351e450ef0c080ef76c30ef880b4963e22ff5"
