name: Ruff changed-file ratchet

on:
  pull_request:

jobs:
  changed-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff>=0.3,<0.4"
      - name: Check changed Python files only
        # The actual reviewed PR base defines incremental scope. Repository-wide
        # legacy findings remain separate; the gate must cover every changed file.
        env:
          RUFF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/ci_ruff_changed.py --base "$RUFF_BASE_SHA"
      - name: Preserve the accumulated checkpoint ratchet
        # The PR change check above does not waive existing accumulated debt.
        # Keep the original declared-checkpoint requirement as a failing gate
        # until those older findings have been reviewed and repaired.
        run: python scripts/ci_ruff_changed.py --base "c76351e450ef0c080ef76c30ef880b4963e22ff5"
