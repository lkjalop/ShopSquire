name: Container Scan (Trivy)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        run: |
          docker build -t shopsquire:ci .
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@0.14.0
        with:
          image-ref: shopsquire:ci
          format: json
          output: trivy.json
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Upload artifact to API (optional)
        if: ${{ env.API_BASE_URL != '' }}
        run: |
          python3 scripts/ci_trivy_upload.py trivy.json "$API_BASE_URL"
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
