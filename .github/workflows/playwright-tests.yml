name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DISABLE_PLAYWRIGHT_TESTS: "0"
      APP_ENV: test
      MERCHANT_API_KEY: local-merchant-key
      OWNER_API_KEY: local-owner-key
      CV_PROVIDER: basic
      CV_OCR_PROVIDER: tesseract
      MODEL_WARMUP_ON_STARTUP: "0"
      CUDA_VISIBLE_DEVICES: "-1"
      PAYMENT_EXECUTION_ENABLED: "0"
      FULFILLMENT_SUPPLIER_TRANSPORT: sandbox
      FULFILLMENT_PO_TRANSPORT: sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install locked backend and test tools
        uses: ./.github/actions/install-backend
        with:
          profile: api-test

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the locked storefront
        working-directory: frontend
        run: npm ci

      - name: Install the locked admin frontend and native OCR
        run: |
          npm ci --prefix src/frontend/admin-react
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr libzbar0

      - name: Verify the browser collection toolchain
        run: |
          python -c "import uvicorn, pytest_playwright, playwright"

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps

      - name: Run Playwright tests
        run: |
          # Ensure tests use sqlite test DB path
          export PLAYWRIGHT_TEST_PORT=8099
          export DATABASE_URL="sqlite:///tests/playwright/smoke.sqlite"
          mkdir -p test-results
          python -m pytest -q tests/pw --timeout=120 --timeout-method=thread --junitxml=test-results/legacy-browser.xml

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts
          path: |
            test-results/**
            runs/**
            tests/**/smoke.sqlite
            pytest_full_out.txt
            playwright_console.log
            **/*_triage.json
          retention-days: 7
