name: CI Smoke Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    services: {}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry
      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi --no-root
      - name: Run unit tests
        run: |
          pytest -q
      - name: Build frontend (Vite)
        uses: actions/setup-node@v5
        with:
          node-version: 18
      - name: Install frontend deps and build
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Start app (background)
        run: |
          nohup python -m uvicorn src.app.main:create_app --host 127.0.0.1 --port 8081 --factory > out.log 2>&1 &
          sleep 4
      - name: Start Prometheus (docker)
        run: |
          docker run -d --name prometheus -p 9090:9090 -v ${{ github.workspace }}/.github/ci/prometheus.yml:/etc/prometheus/prometheus.yml prom/prometheus:latest
          for i in `seq 1 10`; do curl -sSf http://127.0.0.1:9090/-/ready && break || sleep 1; done
      - name: Start Grafana (docker)
        run: |
          docker run -d --name grafana -p 3000:3000 -e "GF_SECURITY_ADMIN_PASSWORD=admin" grafana/grafana:latest
          for i in `seq 1 20`; do curl -sSf http://127.0.0.1:3000/api/health && break || sleep 1; done
      - name: Import Grafana dashboard
        run: |
          DASH=$(cat config/observability/grafana/security_geo_dashboard.json)
          curl -s -X POST -H "Content-Type: application/json" -u admin:admin http://127.0.0.1:3000/api/dashboards/db -d "{\"dashboard\": $DASH, \"overwrite\": true}"
      - name: Health check
        run: |
          curl -sS http://127.0.0.1:8081/health
      - name: Metrics sanity
        run: |
          curl -sS http://127.0.0.1:8081/metrics | egrep 'shopsquire_geoip_lookups_total|shopsquire_geo_asn_risk_total|shopsquire_query_cluster_volume_total' || (echo "Metrics missing" && exit 1)
      - name: Query clustering smoke
        run: |
          curl -s -X POST http://127.0.0.1:8081/api/v1/analytics/query_clusters \
            -H 'Content-Type: application/json' \
            -d '{"queries":["Where is my order?","Track shipment","Refund policy"],"min_cluster_size":1,"persist":false}' | jq .
      - name: RAGAS sampling endpoint
        run: |
          curl -s -X POST 'http://127.0.0.1:8081/api/v1/analytics/ragas/run_sampling?sample_rate=0.01&limit=10' | jq .
