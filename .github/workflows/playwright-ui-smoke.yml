name: Playwright UI + Observability Smoke

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ '*' ]

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      MERCHANT_API_KEY: local-merchant-key
      OWNER_API_KEY: local-owner-key
      DEVELOPER_API_KEY: local-developer-key
      USE_MOCK_LLM: "1"
      USE_OLLAMA_INTENT: "0"
      MODEL_WARMUP_ON_STARTUP: "0"
      CV_PROVIDER: basic
      CV_OCR_PROVIDER: tesseract
      PAYMENT_EXECUTION_ENABLED: "0"
      FULFILLMENT_SUPPLIER_TRANSPORT: sandbox
      FULFILLMENT_PO_TRANSPORT: sandbox
      API_PORT: '8081'
      DISABLE_UI_ROUTES: '0'
      DATABASE_URL: ${{ github.workspace }}/tmp/e2e.sqlite
      DISABLE_PLAYWRIGHT_TESTS: '0'
      PYTEST_STEG_CORPUS_DIRECTORY: ${{ github.workspace }}/.artifacts/ui-smoke-owned-steg-corpus
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install the locked API and test profile
        uses: ./.github/actions/install-backend
        with:
          profile: api-test

      - name: Install frontend deps & Playwright browsers
        run: |
          npm ci --prefix frontend
          npm ci --prefix src/frontend/admin-react
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr libzbar0

      - name: Start backend (uvicorn)
        run: |
          mkdir -p tmp
          export DATABASE_URL="sqlite:///${{ github.workspace }}/tmp/e2e.sqlite"
          export API_PORT=8081
          export DISABLE_UI_ROUTES=0
          # start uvicorn in background
          python -m uvicorn src.app.main:create_app --host 127.0.0.1 --port ${API_PORT} --factory > uvicorn.log 2>&1 &
          # wait for health
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:${API_PORT}/health || echo 000)
            echo "health check: $code"
            if [ "$code" = "200" ]; then break; fi
            sleep 1
          done

      - name: Smoke check metrics, CORS, and WS connectivity
        run: |
          python - <<'PY'
          import requests

          base = 'http://127.0.0.1:8081'
          try:
              response = requests.get(base + '/health', timeout=3)
              print('health', response.status_code)
          except Exception as exc:
              print('health error', exc)
          try:
              response = requests.get(base + '/metrics', timeout=3)
              print(
                  'metrics',
                  response.status_code,
                  'has_http_metric',
                  'shopsquire_http_requests_total' in response.text,
              )
          except Exception as exc:
              print('metrics error', exc)
          try:
              response = requests.options(
                  base + '/api/v1/decisions/stream',
                  headers={
                      'Origin': 'http://localhost:5173',
                      'Access-Control-Request-Method': 'GET',
                  },
                  timeout=3,
              )
              print(
                  'options',
                  response.status_code,
                  'ACAO=',
                  response.headers.get('access-control-allow-origin'),
              )
          except Exception as exc:
              print('options error', exc)
          PY

      - name: Run the admin component suite with its configured runner
        working-directory: src/frontend/admin-react
        run: |
          npm test -- --run
          npx tsc --noEmit
          npm run build

      - name: Generate owned inert security carriers
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tests.image_security_fixtures import generate_steg_corpus
          generate_steg_corpus(Path(os.environ['PYTEST_STEG_CORPUS_DIRECTORY']))
          PY

      - name: Run pytest PW suite
        run: |
          python -m pytest tests/pw -q --timeout=120 --timeout-method=thread
