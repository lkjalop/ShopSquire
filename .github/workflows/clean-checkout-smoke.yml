name: Clean Checkout Smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

jobs:
  smoke-clean-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install -r requirements/bootstrap-runtime.txt
          python -m pip install -r requirements/api-runtime.txt -r requirements/test-runtime.txt
          python -m scripts.generate_runtime_requirements --platform linux --check
          python -m scripts.generate_runtime_requirements --platform windows --check
          python -m pip check

      - name: Compile smoke
        run: |
          python -m compileall -q src/app

      - name: Source size architecture ratchet
        run: |
          python scripts/check_source_file_sizes.py

      - name: Signature and path smoke tests
        run: |
          pytest -q \
            tests/observability/test_evidence_metrics_dependency.py \
            tests/chat/test_ollama_model_routing.py \
            tests/unit/test_recommend_followup_complexity_context.py \
            tests/unit/test_cv_ocr_runtime_snapshot.py \
            tests/unit/test_cv_ocr_degradation.py

      - name: Required owned security HTTP checks
        env:
          SECURITY_SERVER_SPAWN: "1"
          SECURITY_AUTOROUTE_ENABLED: "0"
          EXTERNAL_RESEARCH_ENABLED: "0"
        run: pytest -q tests/scripts/test_generate_runtime_requirements.py tests/security/test_owned_security_runtime.py

      - name: Frontend clean-checkout build
        working-directory: frontend
        run: |
          npm ci
          npm run build
