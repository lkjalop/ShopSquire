name: Clean Checkout Smoke

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  smoke-clean-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry poetry-plugin-export
          poetry export -f requirements.txt --without-hashes -o requirements.txt
          pip install -r requirements.txt
          pip install pytest

      - name: Compile smoke
        run: |
          python -m compileall -q src/app

      - name: Source size architecture ratchet
        run: |
          python scripts/check_source_file_sizes.py

      - name: Signature and path smoke tests
        run: |
          pytest -q \
            tests/observability/test_evidence_metrics_dependency.py \
            tests/chat/test_ollama_model_routing.py \
            tests/unit/test_recommend_followup_complexity_context.py \
            tests/unit/test_cv_ocr_runtime_snapshot.py \
            tests/unit/test_cv_ocr_degradation.py

      - name: Frontend clean-checkout build
        working-directory: frontend
        run: |
          npm ci
          npm run build
