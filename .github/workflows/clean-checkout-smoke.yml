name: Clean Checkout Smoke

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  smoke-clean-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry export -f requirements.txt --without-hashes -o requirements.txt || true
          pip install -r requirements.txt || true
          pip install pytest

      - name: Compile smoke
        run: |
          python -m compileall -q src/app

      - name: Signature and path smoke tests
        run: |
          pytest -q \
            tests/chat/test_ollama_model_routing.py \
            tests/unit/test_recommend_followup_complexity_context.py \
            tests/unit/test_cv_ocr_runtime_snapshot.py \
            tests/unit/test_cv_ocr_degradation.py
