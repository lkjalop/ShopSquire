name: Clean Checkout Smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

jobs:
  smoke-clean-checkout:
    runs-on: ubuntu-latest
    env:
      # Test imports must not boot with production-only secret requirements.
      # Production validation and owned security profiles remain separate.
      APP_ENV: test
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install -r requirements/bootstrap-runtime.txt
          python -m pip install -r requirements/api-runtime.txt -r requirements/test-runtime.txt
          python -m scripts.generate_runtime_requirements --platform linux --check
          python -m scripts.generate_runtime_requirements --platform windows --check
          python -m pip check

      - name: Compile smoke
        run: |
          python -m compileall -q src/app

      - name: Source size architecture ratchet
        run: |
          python scripts/check_json_configs.py
          python scripts/check_source_file_sizes.py
          python scripts/check_function_sizes.py

      - name: Signature and path smoke tests
        run: |
          pytest -q \
            tests/observability/test_evidence_metrics_dependency.py \
            tests/chat/test_ollama_model_routing.py \
            tests/unit/test_recommend_followup_complexity_context.py \
            tests/unit/test_cv_ocr_runtime_snapshot.py \
            tests/unit/test_cv_ocr_degradation.py

      - name: Required owned security HTTP checks
        env:
          SECURITY_SERVER_SPAWN: "1"
          SECURITY_AUTOROUTE_ENABLED: "0"
          EXTERNAL_RESEARCH_ENABLED: "0"
        run: pytest -q tests/scripts/test_generate_runtime_requirements.py tests/security/test_owned_security_runtime.py

      - name: Frontend clean-checkout build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Shared cache scope and partition regression
        env:
          ROADMAP_OWNED_REDIS_URL: redis://127.0.0.1:6379/0
        run: pytest -q tests/integration/test_owned_redis_semantic_scope.py tests/services/test_semantic_cache_guardrails.py

      - name: Electronics catalogue and scenario regression gates
        env:
          APP_ENV: local
        run: |
          pytest -q tests/test_inventory_import_boundaries.py tests/services/test_electronics_shop_scenario.py tests/services/test_shop_operational_history.py tests/api/test_electronics_shop_demo.py tests/services/test_case_contract_binding.py tests/api/test_case_contract_selection.py tests/services/test_v2_contract_binding.py

      - name: Install Chromium for portfolio clickthrough
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Catalogue metadata and buyer estimate boundaries
        env:
          APP_ENV: test
          STRIPE_API_KEY: ""
          STRIPE_API_KEY_REF: ""
        run: |
          pytest -q \
            tests/test_catalog_fixture_retrieval_contract.py \
            tests/services/test_buyer_supplier_constraints.py \
            tests/services/test_buyer_supplier_selection.py \
            tests/services/test_buyer_supplier_quotes.py \
            tests/services/test_payment_provider_execution_policy.py \
            tests/unit/test_cloud_runtime_config.py \
            tests/api/test_payment_ledger_refunds.py

      - name: Migrated synthetic shop and real API browser clickthrough
        run: |
          for scenario in electronics-shop-scenario case-contract-selection governed-product-offers supplier-enquiry-journey supplier-recovery; do
            fixture=".artifacts/electronics-ci/$scenario"
            python -m scripts.prepare_roadmap_demo --directory "$fixture"
            python -m scripts.run_roadmap_browser --directory "$fixture" --api-port 8087 --ui-port 5173 "$scenario.spec.ts"
            python -m scripts.run_roadmap_browser --directory "$fixture" --restore --api-port 8087 --ui-port 5173 "$scenario.spec.ts"
          done

      - name: Preserve electronics scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electronics-shop-evidence
          path: |
            .artifacts/electronics-ci/**/receipt.json
            .artifacts/electronics-ci/**/report.json
            .artifacts/electronics-ci/**/*.log
            .artifacts/electronics-ci/**/traces
