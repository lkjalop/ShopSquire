name: Security Scans (Trivy, SBOM, Snyk)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  # ── PCI DSS Req. 3: no cardholder data in the repo ──────────────────────────
  # Fails the build if a real (Luhn-valid, major-network) PAN is committed to source, config, or a
  # checked-in log. Documented network TEST PANs are allowlisted. This is the gate that backs the
  # "tokenized, no CHD stored" claim. Unit-tested by tests/security/test_no_pan_scan.py.
  pci-no-pan-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan repository for cardholder data (PAN)
        run: python scripts/scan_no_pan.py .


  trivy-filesystem:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Trivy FS scan (JSON)
        uses: aquasecurity/trivy-action@0.19.0
        with:
          scan-type: 'fs'
          format: 'json'
          output: 'trivy-fs.json'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH,MEDIUM'
      - name: Upload artifact (Trivy FS)
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs.json
          path: trivy-fs.json
      - name: Post to compliance registry (optional)
        if: ${{ env.API_BASE_URL != '' && env.ADMIN_API_KEY != '' }}
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          python -m pip install orjson requests
          python scripts/upload_compliance_artifact.py --type container_scan --vendor trivy --file trivy-fs.json

  sbom-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0.15.9
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload artifact (SBOM)
        uses: actions/upload-artifact@v4
        with:
          name: sbom.spdx.json
          path: sbom.spdx.json
      - name: SBOM diff check (baseline optional)
        run: |
          python scripts/sbom_diff_check.py
      - name: Install Cosign (optional)
        uses: sigstore/cosign-installer@v3.6.0
      - name: Sign SBOM (keyless, optional)
        env:
          COSIGN_EXPERIMENTAL: 1
          COSIGN_ENABLED: ${{ secrets.COSIGN_ENABLED }}
        run: |
          if [ "${COSIGN_ENABLED}" = "true" ]; then
            cosign sign-blob --yes --output-signature sbom.spdx.sig sbom.spdx.json || true
          else
            echo "COSIGN_ENABLED not true; skipping signing"
          fi
      - name: Upload signature (optional)
        uses: actions/upload-artifact@v4
        with:
          name: sbom.spdx.sig
          path: sbom.spdx.sig

  snyk-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node (for Snyk CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Snyk
        run: npm install -g snyk@latest
      - name: Snyk auth
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "${SNYK_TOKEN}" ]; then
            echo "SNYK_TOKEN not set; skipping"
            exit 0
          fi
          snyk auth $SNYK_TOKEN
      - name: Snyk Python scan
        run: |
          if [ -z "${SNYK_TOKEN}" ]; then
            echo "SNYK_TOKEN not set; skipping"
            exit 0
          fi
          snyk test --file=pyproject.toml --package-manager=pip --json > snyk-python.json || true
      - name: Upload artifact (Snyk Python)
        uses: actions/upload-artifact@v4
        with:
          name: snyk-python.json
          path: snyk-python.json
      - name: Post to compliance registry (optional)
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          python -m pip install orjson requests
          python scripts/upload_compliance_artifact.py --type dependency_scan --vendor snyk --file snyk-python.json

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
      - name: Run pip-audit
        run: |
          pip-audit -f json -o pip-audit.json || true
      - name: Upload artifact (pip-audit)
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit.json
          path: pip-audit.json

  # ── 8.4 SLSA provenance ──────────────────────────────────────────────────
  # Generates SLSA Level 3 build provenance attestation so downstream consumers
  # can verify the artifact was produced by this exact GitHub Actions workflow
  # from this exact commit — addressing the supply-chain gap in finding 8.4.
  slsa-provenance:
    needs: [trivy-filesystem, sbom-generate, pip-audit]
    runs-on: ubuntu-latest
    permissions:
      id-token: write    # Required: OIDC token for keyless signing
      contents: read     # Required: checkout
      actions: read      # Required: workflow manifest access for SLSA generator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist/

      - name: List built artifacts
        id: list-artifacts
        run: |
          # Emit a newline-delimited list of .tar.gz paths for the provenance generator
          ARTIFACTS=$(find dist/ -name "*.tar.gz" | tr '\n' ' ')
          echo "artifacts=${ARTIFACTS}" >> "$GITHUB_OUTPUT"

      - name: Generate artifact hashes for SLSA
        id: hash
        run: |
          cd dist
          SHA256=$(sha256sum *.tar.gz | base64 -w0)
          echo "hashes=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Generate SLSA provenance
        # slsa-github-generator produces a signed SLSA Level 3 provenance bundle
        # using the OIDC identity of this workflow run.
        uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
        with:
          base64-subjects: ${{ steps.hash.outputs.hashes }}
          upload-assets: false   # We upload manually so we control artifact names

      - name: Upload provenance bundle
        uses: actions/upload-artifact@v4
        with:
          name: slsa-provenance.intoto.jsonl
          path: "*.intoto.jsonl"
          if-no-files-found: warn

      - name: Post to compliance registry (optional)
        if: ${{ env.API_BASE_URL != '' && env.ADMIN_API_KEY != '' }}
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          python -m pip install orjson requests
          # Upload the first provenance file found
          PROV=$(find . -name "*.intoto.jsonl" | head -1)
          if [ -n "${PROV}" ]; then
            python scripts/upload_compliance_artifact.py \
              --type slsa_provenance --vendor slsa-github-generator --file "${PROV}"
          fi
