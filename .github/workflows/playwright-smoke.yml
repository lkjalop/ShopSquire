name: Playwright Smoke

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      MERCHANT_API_KEY: local-merchant-key
      OWNER_API_KEY: local-owner-key
      USE_MOCK_LLM: "1"
      USE_OLLAMA_INTENT: "0"
      MODEL_WARMUP_ON_STARTUP: "0"
      PAYMENT_EXECUTION_ENABLED: "0"
      FULFILLMENT_SUPPLIER_TRANSPORT: sandbox
      FULFILLMENT_PO_TRANSPORT: sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install the locked API and test profile
        uses: ./.github/actions/install-backend
        with:
          profile: api-test

      - name: Install dependencies
        run: |
          npm --prefix frontend ci

      - name: Install Playwright browsers
        run: |
          poetry run python -m playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        env:
          DISABLE_TRACING: '1'
          DISABLE_PLAYWRIGHT_TESTS: '0'
        run: |
          poetry run python -m pytest -q tests/pw/test_storefront_frontend_smoke.py
