name: CI with Prometheus

on:
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    services:
      prometheus:
        image: prom/prometheus:latest
        ports:
          - 9090:9090
        options: >-
          --health-cmd "curl -sS http://localhost:9090/-/healthy || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi --no-root
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: |
          pushd frontend
          npm ci
          npm run build
          popd
      - name: Start app
        run: |
          nohup python -m uvicorn src.app.main:create_app --host 127.0.0.1 --port 8081 --factory > out.log 2>&1 &
          sleep 6
      - name: Wait for Prometheus
        run: |
          for i in {1..10}; do curl -sS http://localhost:9090/-/healthy && break || sleep 2; done
      - name: Verify metrics endpoint
        run: |
          curl -sS http://127.0.0.1:8081/metrics | egrep 'shopsquire_geoip_lookups_total|shopsquire_ragas_evaluations_total' || (echo "Metrics missing" && exit 1)
      - name: Query Prometheus for a metric
        run: |
          curl -sS 'http://localhost:9090/api/v1/query?query=shopsquire_geoip_lookups_total' | jq . || true
