name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  security-focused:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+pysqlite:///./tmp/ci-security.sqlite
      METRICS_INTERNAL_ONLY: "0"
      METRICS_REQUIRE_AUTH: "0"
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install locked backend and test tools
        uses: ./.github/actions/install-backend
      - name: Run focused security suite
        env:
          APP_ENV: test
        run: |
          python -m pytest -q \
            tests/security/test_publication_security.py \
            tests/security/test_dmarc_boundaries.py \
            tests/services/test_terminal_qualification_security.py \
            tests/services/test_market_pipeline.py \
            tests/services/fulfillment/test_transport.py \
            tests/services/fulfillment/test_transport_health.py \
            tests/security/test_url_guard.py \
            tests/security/test_model_theft_guard.py \
            tests/security/test_cv_qr_redirect_chain.py \
            tests/security/test_steg_detector_dct.py \
            tests/unit/test_metrics_rbac.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        # Quote interpreter versions in matrices.
        python-version: ["3.11"]
    services:
      postgres:
        # Match the production-shaped migration/browser workflow and include
        # the vector extension required by the canonical embedding schema.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopsquire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: test
      MERCHANT_API_KEY: local-merchant-key
      OWNER_API_KEY: local-owner-key
      DEVELOPER_API_KEY: local-developer-key
      USE_MOCK_LLM: "1"
      USE_OLLAMA_INTENT: "0"
      MODEL_WARMUP_ON_STARTUP: "0"
      VLM_WARMUP_ON_START: "0"
      CV_WARMUP_ON_START: "0"
      PAYMENT_EXECUTION_ENABLED: "0"
      FULFILLMENT_SUPPLIER_TRANSPORT: sandbox
      FULFILLMENT_PO_TRANSPORT: sandbox
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: shopsquire_test
      PGPORT: 5432
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopsquire_test
      # Activates tests/chaos/test_money_concurrency_postgres.py — the threaded money-race suite that
      # SQLite cannot model (it skips without this). Uses its own throwaway schemas on the same PG.
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/shopsquire_test
      ENABLE_DB_MATRIX: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked backend and test tools
        uses: ./.github/actions/install-backend
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && break || sleep 1
          done
      - name: Apply migrations
        run: |
          set -e
          python -m alembic -c alembic.ini upgrade head
      - name: Check for sync db_session() in async routes
        run: |
          python scripts/check_async_db.py src/app/routers
      - name: Shadow migration check
        run: |
          python scripts/shadow_migration_check.py --db-url "${{ env.DATABASE_URL }}"
      - name: Install Playwright browsers
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps
      - name: Run PostgreSQL-owned contracts
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          mkdir -p test-results
          timeout --signal=TERM --kill-after=30s 1200s \
            python -m pytest -vv --timeout=120 --timeout-method=thread \
              --junitxml=test-results/postgres-${{ matrix.python-version }}.xml \
              tests/chaos/test_money_concurrency_postgres.py \
              tests/chaos/test_release_integrity_postgres.py \
              tests/chaos/test_money_concurrency_http.py \
              tests/chaos/test_demand_allocation_concurrency_postgres.py \
              tests/architecture/test_postgres_security_boundaries.py \
              tests/integration/test_db_postgres_timescale_matrix.py \
              tests/test_verify_db_migrations.py
      - name: Upload PostgreSQL diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: postgres-contracts-${{ matrix.python-version }}
          path: test-results/**
          retention-days: 14
