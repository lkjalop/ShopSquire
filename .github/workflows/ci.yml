name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  security-focused:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+pysqlite:///./tmp/ci-security.sqlite
      METRICS_INTERNAL_ONLY: "0"
      METRICS_REQUIRE_AUTH: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            python -m pip install poetry
            poetry config virtualenvs.create false
            poetry install --no-interaction --no-ansi
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pytest
          fi
      - name: Run focused security suite
        run: |
          python -m pytest -q \
            tests/security/test_url_guard.py \
            tests/security/test_model_theft_guard.py \
            tests/security/test_cv_qr_redirect_chain.py \
            tests/security/test_steg_detector_dct.py \
            tests/unit/test_metrics_rbac.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # YAML parses an unquoted 3.10 as the number 3.1.
        python-version: ["3.10", "3.11"]
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopsquire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: shopsquire_test
      PGPORT: 5432
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopsquire_test
      # Activates tests/chaos/test_money_concurrency_postgres.py — the threaded money-race suite that
      # SQLite cannot model (it skips without this). Uses its own throwaway schemas on the same PG.
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/shopsquire_test
      SPLUNK_HEC_URL: ${{ secrets.SPLUNK_HEC_URL }}
      SPLUNK_HEC_TOKEN: ${{ secrets.SPLUNK_HEC_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            python -m pip install poetry
            poetry config virtualenvs.create false
            poetry install --no-interaction --no-ansi
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pytest psycopg2-binary sqlalchemy alembic
          fi
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && break || sleep 1
          done
      - name: Apply migrations
        run: |
          set -e
          if [ -f pyproject.toml ]; then
            poetry run alembic -c alembic.ini upgrade head
          else
            alembic -c alembic.ini upgrade head
          fi
      - name: Check for sync db_session() in async routes
        run: |
          python scripts/check_async_db.py src/app/routers || true
      - name: Shadow migration check
        run: |
          python scripts/shadow_migration_check.py --db-url "${{ env.DATABASE_URL }}"
      - name: Install Playwright browsers
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps
      - name: Run tests
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          python -m pytest -q --cov=src --cov-report=xml --cov-report=term-missing
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml
      - name: Emit Splunk test event (optional)
        if: env.SPLUNK_HEC_URL != '' && env.SPLUNK_HEC_TOKEN != ''
        run: |
          set -e
          echo "Posting Splunk HEC test event to $SPLUNK_HEC_URL"
          body=$(jq -cn --arg msg "ci-test-event" --arg comp "ci" --arg sev "info" '{time:(now|floor), sourcetype:"shopsquire:security", event:{message:$msg, component:$comp, severity:$sev}}')
          resp=$(curl -sS -X POST "$SPLUNK_HEC_URL" -H "Authorization: Splunk $SPLUNK_HEC_TOKEN" -H "Content-Type: application/json" -d "$body" || true)
          echo "Splunk HEC response: $resp"
