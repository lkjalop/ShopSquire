name: Security Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_ENV: test
      ROUTER_MODEL_ENABLED: "0"
      PAYMENT_EXECUTION_ENABLED: "0"
      FULFILLMENT_SUPPLIER_TRANSPORT: sandbox
      FULFILLMENT_PO_TRANSPORT: sandbox
      SECURITY_SERVER_SPAWN: "1"
      CV_PROVIDER: basic
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install locked backend and test tools
        uses: ./.github/actions/install-backend
      - name: Install matching Python browser
        run: python -m playwright install --with-deps chromium
      - name: Run tests in the installed interpreter
        run: python -m pytest -q
