[tool.poetry]
name = "shopsquire"
version = "0.1.0"
description = "ShopSquire agentic commerce API (MVP scaffold)"
authors = ["ShopSquire Team <dev@shopsquire.local>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
pydantic = "^2.6.3"
email-validator = "^2.1.0.post1"
python-dotenv = "^1.0.1"
python-multipart = "^0.0.9"
redis = "^5.0.1"
SQLAlchemy = "^2.0.25"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.1"
orjson = "^3.9.15"
httpx = "^0.27.0"
dnspython = "^2.6.1"
ujson = "^5.9.0"
opentelemetry-api = "^1.21.0"
opentelemetry-sdk = "^1.21.0"
opentelemetry-exporter-jaeger-thrift = "^1.21.0"
opentelemetry-instrumentation-fastapi = "^0.44b0"
opentelemetry-instrumentation-redis = "^0.44b0"
opentelemetry-instrumentation-requests = "^0.44b0"
numpy = "^1.26.4"
Pillow = "^10.2.0"
pytesseract = "^0.3.10"
opencv-python-headless = "^4.10.0.84"
pyzbar = "^0.1.9"
paddleocr = "^2.7.0"
imagehash = "^4.3.1"
PyJWT = "^2.9.0"
cryptography = "^41.0.7"
prometheus-client = "^0.17.0"
celery = "^5.3.0"
flower = "^1.0.0"
sentence-transformers = ">=2.2.0"
faiss-cpu = ">=1.7.4"
ragas = ">=0.1.0"
datasets = ">=2.14.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.5"
pytest-playwright = "^0.4.4"
playwright = "^1.41.2"
pytest-cov = "^4.1.0"
ruff = "^0.3.0"
mypy = "^1.8.0"
types-redis = "^4.6.0.20240106"
requests = "^2.31.0"
neo4j = "^5.18.0"

[tool.coverage.run]
source = ["src"]
omit = [
    "src/app/migrations/*",
    "src/app/workers/celery_app.py",
    "*/__pycache__/*",
    "*/sitecustomize.py",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60

[tool.ruff]
line-length = 100
target-version = "py310"
extend-select = ["E722"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
