[tool.poetry]
name = "shopsquire"
version = "0.1.0"
description = "ShopSquire agentic commerce API (MVP scaffold)"
authors = ["ShopSquire Team <dev@shopsquire.local>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.149.0,<0.150.0"
starlette = ">=1.7.0,<1.8.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
pydantic = "^2.6.3"
email-validator = "^2.1.0.post1"
python-dotenv = "^1.0.1"
python-multipart = ">=0.0.32,<0.1.0"
redis = "^5.0.1"
SQLAlchemy = "^2.0.25"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.1"
orjson = "^3.9.15"
httpx = "^0.27.0"
certifi = ">=2026.10.19,<2027.0.0"
beautifulsoup4 = ">=4.14.3,<5"
openpyxl = "^3.1.0"
dnspython = "^2.6.1"
ujson = "^5.9.0"
opentelemetry-api = "^1.45.1"
opentelemetry-sdk = "^1.45.1"
opentelemetry-exporter-jaeger-thrift = "^1.21.0"
opentelemetry-exporter-otlp = "^1.45.1"
opentelemetry-instrumentation-fastapi = "^0.66b1"
opentelemetry-instrumentation-redis = "^0.66b1"
opentelemetry-instrumentation-requests = "^0.66b1"
numpy = ">=2.1.0,<2.4.0"
Pillow = ">=13.0.0,<14.0.0"
pytesseract = "^0.3.10"
pypdfium2 = "^4.30.0"
opencv-contrib-python = ">=4.10.0.84,<5"
pyzbar = "^0.1.9"
paddleocr = ">=3.7.0,<3.8"
paddlepaddle = ">=3.3.1,<3.4"
aiohttp = ">=3.14.4,<3.15"
multidict = ">=6.9.1,<7"
imagehash = "^4.3.1"
PyJWT = ">=2.15.1,<3.0.0"
protobuf = ">=6.33.5,<8.0.0"
urllib3 = ">=2.8.0,<3.0.0"
cryptography = ">=50.0.2,<51.0.0"
prometheus-client = "^0.17.0"
celery = "^5.3.0"
flower = "^1.0.0"
sentence-transformers = ">=2.2.0"
faiss-cpu = ">=1.7.4"
neo4j = "^5.18.0"
networkx = "^3.2"
argon2-cffi = "^23.1.0"
python-json-logger = "^2.0.7"
azure-identity = {version = "^1.17.0", optional = true}
azure-keyvault-secrets = {version = "^4.8.0", optional = true}
azure-storage-blob = {version = "^12.22.0", optional = true}

# Unpatched Ragas/DiskCache and their unused framework chain are not shipped.
# The compatibility evaluation API reports unavailable metrics until an approved
# evaluator is deployed. Filelock remains a vision/retrieval transitive.
filelock = ">=4.2.1,<5.0.0"
tornado = ">=6.5.9,<7.0.0"

[tool.poetry.extras]
azure = ["azure-identity", "azure-keyvault-secrets", "azure-storage-blob"]

[tool.poetry.group.dev.dependencies]
pip = ">=26.2.1,<27"
setuptools = ">=84.2.0,<85"
wheel = ">=0.48.0,<0.49"
pytest = ">=9.0.3,<10.0.0"
pytest-asyncio = "^1.4.0"
pytest-playwright = "^0.10.0"
playwright = "^1.41.2"
pytest-cov = "^7.1.0"
pytest-timeout = "^2.4.0"
ruff = "^0.3.0"
mypy = "^1.8.0"
types-redis = "^4.6.0.20240106"
requests = "^2.31.0"
reportlab = "^5.0.1"
qrcode = "^8.2"
psutil = ">=7.2.2,<8.0.0"
pyzbar = "^0.1.9"
pytesseract = "^0.3.10"

[tool.coverage.run]
source = ["src"]
omit = [
    "src/app/migrations/*",
    "src/app/workers/celery_app.py",
    "*/__pycache__/*",
    "*/sitecustomize.py",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["E722"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
