version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: shopsquire
      POSTGRES_USER: shopsquire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - 5432:5432

  redis:
    image: redis:7
    ports:
      - 6379:6379

  backend:
    build: .
    command: ["uvicorn", "src.app.main:create_app", "--host", "0.0.0.0", "--port", "8080", "--factory"]
    env_file:
      - .env.dev
    depends_on:
      - postgres
      - redis
    ports:
      - 8080:8080
    volumes:
      - ./:/app:delegated

  worker:
    build: .
    command: ["/bin/sh", "-c", "celery -A src.app.workers.celery_app.celery_app worker --loglevel=info -Q default"]
    env_file:
      - .env.dev
    depends_on:
      - redis
      - postgres
    volumes:
      - ./:/app:delegated

  flower:
    image: mher/flower
    command: ["flower", "--port=5555", "--broker=redis://redis:6379/0"]
    ports:
      - 5555:5555
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - 9090:9090

  grafana:
    image: grafana/grafana:9.5.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-grafana-change-me}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - 3000:3000

volumes:
  pgdata:
