version: "3.9"
services:
  api:
    build: .
    container_name: shopsquire_api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/shopsquire
      REDIS_URL: redis://default:${REDIS_PASSWORD:-redis-change-me}@redis:6379/0
      RUN_MIGRATIONS: "1"
      AUTO_MIGRATE: "1"
      DB_MIGRATION_GUARD: "1"
      INTERNAL_MTLS_REQUIRED: "1"
      CHAT_REPLAY_REQUIRE_NONCE: "1"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "src.app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    user: "shopsquire"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=default
    read_only: true
    tmpfs:
      - /tmp:size=256M

  db:
    image: postgres:16
    container_name: shopsquire_db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: shopsquire
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shopsquire_redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis-change-me}", "--aclfile", "/etc/redis/users.acl"]
    ports:
      - "6379:6379"
    volumes:
      - ./config/redis/users.acl:/etc/redis/users.acl:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis-change-me}", "ping"]
      interval: 5s
      retries: 5

  sync-worker:
    build: .
    container_name: shopsquire_sync_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/shopsquire
      REDIS_URL: redis://default:${REDIS_PASSWORD:-redis-change-me}@redis:6379/0
      DB_MIGRATION_GUARD: "1"
      INVENTORY_SYNC_CONNECTORS: "csv,shopify"
      INVENTORY_SYNC_INTERVAL_SEC: "300"
      INVENTORY_SYNC_STARTUP_DELAY_SEC: "15"
      INVENTORY_SYNC_DRY_RUN: "0"
      INVENTORY_SYNC_UPSERT_PRODUCTS: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "scripts/sync_worker.py"]
    restart: unless-stopped
    user: "shopsquire"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=default

  security-crowdstrike-poll:
    build: .
    container_name: shopsquire_security_crowdstrike_poll
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/shopsquire
      REDIS_URL: redis://default:${REDIS_PASSWORD:-redis-change-me}@redis:6379/0
      SECURITY_CROWDSTRIKE_POLL_ENABLED: "1"
      SECURITY_CROWDSTRIKE_POLL_INTERVAL_SEC: "300"
      SECURITY_CROWDSTRIKE_POLL_LOOKBACK_MINUTES: "30"
      SECURITY_CROWDSTRIKE_POLL_LIMIT: "100"
      SECURITY_CROWDSTRIKE_POLL_TENANT_ID: "default"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "scripts/run_crowdstrike_poll_worker.py"]
    restart: unless-stopped
    user: "shopsquire"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=default

  security-syslog-listener:
    build: .
    container_name: shopsquire_security_syslog_listener
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/shopsquire
      SYSLOG_LISTENER_HOST: "0.0.0.0"
      SYSLOG_LISTENER_ENABLE_TCP: "1"
      SYSLOG_LISTENER_ENABLE_UDP: "1"
      SYSLOG_LISTENER_TCP_PORT: "5514"
      SYSLOG_LISTENER_UDP_PORT: "5514"
      SYSLOG_LISTENER_TENANT_ID: "default"
    ports:
      - "5514:5514/tcp"
      - "5514:5514/udp"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "scripts/run_syslog_listener.py"]
    restart: unless-stopped
    user: "shopsquire"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=default

  security-celery-worker:
    build: .
    container_name: shopsquire_security_celery_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/shopsquire
      REDIS_URL: redis://default:${REDIS_PASSWORD:-redis-change-me}@redis:6379/0
      CELERY_BROKER_URL: redis://default:${REDIS_PASSWORD:-redis-change-me}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://default:${REDIS_PASSWORD:-redis-change-me}@redis:6379/1
      SECURITY_CROWDSTRIKE_POLL_ENABLED: "1"
      SECURITY_CROWDSTRIKE_POLL_MINUTES: "5"
      SECURITY_CROWDSTRIKE_POLL_TENANT_ID: "default"
      SECURITY_CROWDSTRIKE_POLL_LIMIT: "100"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "src.app.workers.celery_app.celery_app", "worker", "--loglevel=INFO"]
    restart: unless-stopped
    user: "shopsquire"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=default

  security-celery-beat:
    build: .
    container_name: shopsquire_security_celery_beat
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/shopsquire
      REDIS_URL: redis://default:${REDIS_PASSWORD:-redis-change-me}@redis:6379/0
      CELERY_BROKER_URL: redis://default:${REDIS_PASSWORD:-redis-change-me}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://default:${REDIS_PASSWORD:-redis-change-me}@redis:6379/1
      SECURITY_CROWDSTRIKE_POLL_ENABLED: "1"
      SECURITY_CROWDSTRIKE_POLL_MINUTES: "5"
      SECURITY_CROWDSTRIKE_POLL_TENANT_ID: "default"
      SECURITY_CROWDSTRIKE_POLL_LIMIT: "100"
    depends_on:
      redis:
        condition: service_healthy
    command: ["celery", "-A", "src.app.workers.celery_app.celery_app", "beat", "--loglevel=INFO"]
    restart: unless-stopped
    user: "shopsquire"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=default

  prometheus:
    image: prom/prometheus:latest
    container_name: shopsquire_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./config/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/observability/prometheus_rules.yml:/etc/prometheus/rules/prometheus_rules.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api

  alertmanager:
    image: prom/alertmanager:latest
    container_name: shopsquire_alertmanager
    environment:
      # Local-dev defaults to keep Alertmanager config valid without external integrations.
      SLACK_WEBHOOK_URL: "http://localhost:0/"
      PAGERDUTY_KEY: "dummy"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ./config/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    depends_on:
      - prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: shopsquire_grafana
    environment:
      GF_INSTALL_PLUGINS: simpod-json-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-grafana-change-me}"
    ports:
      - "127.0.0.1:3005:3000"
    volumes:
      - ./config/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus

  db-backup:
    image: postgres:16
    container_name: shopsquire_db_backup
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: shopsquire
      BACKUP_DIR: /var/backups/shopsquire
      BACKUP_RETENTION_DAYS: "7"
    volumes:
      - ./scripts/pg_backup.sh:/usr/local/bin/pg_backup.sh:ro
      - db-backups:/var/backups/shopsquire
    depends_on:
      db:
        condition: service_healthy
    # Run daily at 02:00 UTC via a simple sleep loop
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        chmod +x /usr/local/bin/pg_backup.sh
        echo "[db-backup] Running initial backup..."
        /usr/local/bin/pg_backup.sh
        echo "[db-backup] Entering daily schedule (every 86400s)"
        while true; do sleep 86400; /usr/local/bin/pg_backup.sh; done
    restart: unless-stopped
    user: "postgres"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=default
    read_only: true
    tmpfs:
      - /tmp:size=512M

volumes:
  pgdata:
  db-backups:
