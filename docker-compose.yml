version: "3.9"
services:
  api:
    build: .
    container_name: shopsquire_api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/shopsquire
      REDIS_URL: redis://default:${REDIS_PASSWORD:-redis-change-me}@redis:6379/0
      # APP_ENV controls security guards: "local" = dev permissive, "staging" or "production" = enforced.
      # Set to "production" to enforce JWT_SIGNING_KEY, Redis TLS/ACL, and other prod guards.
      APP_ENV: "${APP_ENV:-staging}"
      RUN_MIGRATIONS: "1"
      AUTO_MIGRATE: "1"
      DB_MIGRATION_GUARD: "1"
      INTERNAL_MTLS_REQUIRED: "1"
      CHAT_REPLAY_REQUIRE_NONCE: "1"
      ENFORCE_CONNECTOR_SCOPES: "1"
      SECURITY_HEADERS_ENABLED: "1"
      METRICS_REQUIRE_AUTH: "1"
      METRICS_INTERNAL_ONLY: "1"
      AUDIT_CHAIN_WORM_ARCHIVE_PATH: "/var/lib/shopsquire/audit/audit_chain.worm"
      # CV / OCR — tesseract is pre-installed and needs no runtime download.
      # PaddleOCR is available but must write its model cache; redirect it to
      # the /tmp tmpfs so the read-only filesystem constraint doesn't break it.
      CV_OCR_PROVIDER: "tesseract"
      PADDLEOCR_HOME: "/tmp/paddle"
      # Fraud graph — active when neo4j profile is running
      FRAUD_GRAPH_NEO4J_ENABLED: "1"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-neo4j-change-me}"
      # MAESTRO agent boundary enforcement.
      # "audit"  → log violations only (default, safe for development)
      # "warn"   → log + emit warning, continue execution (recommended for demo/staging)
      # "block"  → raise MaestroViolationError for critical/high violations (production)
      MAESTRO_ENFORCEMENT_MODE: "warn"
      # Recommendation latency lever — LLM narration was measured at ~85-91% of route latency, so the
      # blocking narration call is what pushes complex queries to 10-13s. Env wins over the
      # config/feature_flags.json value ("blocking").
      #   async    → return the deterministic grounded answer immediately (<5s warm) AND compute the LLM
      #              prose out-of-band (GET /api/v1/recommend/narration/{job_id}). Demo-friendly default.
      #   skip     → deterministic grounded answer only; no prose computed (no wasted background work).
      #   blocking → wait for the LLM prose, capped at RECOMMEND_NARRATION_TIMEOUT_SEC then fall back.
      RECOMMEND_NARRATION_MODE: "${RECOMMEND_NARRATION_MODE:-async}"
      RECOMMEND_NARRATION_TIMEOUT_SEC: "${RECOMMEND_NARRATION_TIMEOUT_SEC:-6}"
      # Shipping label providers — set API keys to enable real label generation.
      # Without keys the provider returns a structured error (no crash).
      # AUSPOST_API_KEY: ""          # AusPost eParcel — developers.auspost.com.au
      # AUSPOST_ACCOUNT_NUMBER: ""
      # STARTRACK_API_KEY: ""        # StarTrack — uses same AusPost developer portal
      # STARTRACK_ACCOUNT_NUMBER: ""
      # EASYPOST_API_KEY: ""         # EasyPost multi-carrier — easypost.com
      # SHIPSTATION_API_KEY: ""      # ShipStation — shipstation.com
      # SHIPSTATION_API_SECRET: ""
      # RAGAS LLM evaluation — requires an LLM provider key.
      # Without a key the service falls back to heuristic scoring.
      # RAGAS_ENABLED: "1"
      # OPENAI_API_KEY: ""           # Used by ragas for faithfulness evaluation
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "src.app.main:app", "--host", "0.0.0.0", "--port", "8080", "--timeout-graceful-shutdown", "30"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=5)
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 30s
    volumes:
      - audit-worm:/var/lib/shopsquire/audit
    user: "shopsquire"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=512M

  db:
    image: pgvector/pgvector:pg16
    container_name: shopsquire_db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: shopsquire
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shopsquire_redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis-change-me}", "--aclfile", "/etc/redis/users.acl"]
    ports:
      - "6379:6379"
    volumes:
      - ./config/redis/users.acl:/etc/redis/users.acl:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis-change-me}", "ping"]
      interval: 5s
      retries: 5

  sync-worker:
    build: .
    container_name: shopsquire_sync_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/shopsquire
      REDIS_URL: redis://default:${REDIS_PASSWORD:-redis-change-me}@redis:6379/0
      DB_MIGRATION_GUARD: "1"
      INVENTORY_SYNC_CONNECTORS: "csv,shopify"
      INVENTORY_SYNC_INTERVAL_SEC: "300"
      INVENTORY_SYNC_STARTUP_DELAY_SEC: "15"
      INVENTORY_SYNC_DRY_RUN: "0"
      INVENTORY_SYNC_UPSERT_PRODUCTS: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "scripts/sync_worker.py"]
    restart: unless-stopped
    user: "shopsquire"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  security-crowdstrike-poll:
    build: .
    container_name: shopsquire_security_crowdstrike_poll
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/shopsquire
      REDIS_URL: redis://default:${REDIS_PASSWORD:-redis-change-me}@redis:6379/0
      SECURITY_CROWDSTRIKE_POLL_ENABLED: "1"
      SECURITY_CROWDSTRIKE_POLL_INTERVAL_SEC: "300"
      SECURITY_CROWDSTRIKE_POLL_LOOKBACK_MINUTES: "30"
      SECURITY_CROWDSTRIKE_POLL_LIMIT: "100"
      SECURITY_CROWDSTRIKE_POLL_TENANT_ID: "default"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "scripts/run_crowdstrike_poll_worker.py"]
    restart: unless-stopped
    user: "shopsquire"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  security-syslog-listener:
    build: .
    container_name: shopsquire_security_syslog_listener
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/shopsquire
      SYSLOG_LISTENER_HOST: "0.0.0.0"
      SYSLOG_LISTENER_ENABLE_TCP: "1"
      SYSLOG_LISTENER_ENABLE_UDP: "1"
      SYSLOG_LISTENER_TCP_PORT: "5514"
      SYSLOG_LISTENER_UDP_PORT: "5514"
      SYSLOG_LISTENER_TENANT_ID: "default"
    ports:
      - "5514:5514/tcp"
      - "5514:5514/udp"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "scripts/run_syslog_listener.py"]
    restart: unless-stopped
    user: "shopsquire"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  security-celery-worker:
    build: .
    container_name: shopsquire_security_celery_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/shopsquire
      REDIS_URL: redis://default:${REDIS_PASSWORD:-redis-change-me}@redis:6379/0
      CELERY_BROKER_URL: redis://default:${REDIS_PASSWORD:-redis-change-me}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://default:${REDIS_PASSWORD:-redis-change-me}@redis:6379/1
      CELERY_TASK_SIGNING_ENABLED: "1"
      CELERY_SECURITY_KEY: /etc/shopsquire/certs/celery-private.key
      CELERY_SECURITY_CERTIFICATE: /etc/shopsquire/certs/celery-cert.pem
      CELERY_SECURITY_CERT_STORE: /etc/shopsquire/certs/ca.pem
      SECURITY_CROWDSTRIKE_POLL_ENABLED: "1"
      SECURITY_CROWDSTRIKE_POLL_MINUTES: "5"
      SECURITY_CROWDSTRIKE_POLL_TENANT_ID: "default"
      SECURITY_CROWDSTRIKE_POLL_LIMIT: "100"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "src.app.workers.celery_app.celery_app", "worker", "--loglevel=INFO"]
    restart: unless-stopped
    user: "shopsquire"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  security-celery-beat:
    build: .
    container_name: shopsquire_security_celery_beat
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/shopsquire
      REDIS_URL: redis://default:${REDIS_PASSWORD:-redis-change-me}@redis:6379/0
      CELERY_BROKER_URL: redis://default:${REDIS_PASSWORD:-redis-change-me}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://default:${REDIS_PASSWORD:-redis-change-me}@redis:6379/1
      CELERY_TASK_SIGNING_ENABLED: "1"
      CELERY_SECURITY_KEY: /etc/shopsquire/certs/celery-private.key
      CELERY_SECURITY_CERTIFICATE: /etc/shopsquire/certs/celery-cert.pem
      CELERY_SECURITY_CERT_STORE: /etc/shopsquire/certs/ca.pem
      SECURITY_CROWDSTRIKE_POLL_ENABLED: "1"
      SECURITY_CROWDSTRIKE_POLL_MINUTES: "5"
      SECURITY_CROWDSTRIKE_POLL_TENANT_ID: "default"
      SECURITY_CROWDSTRIKE_POLL_LIMIT: "100"
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "src.app.workers.leased_beat"]
    restart: unless-stopped
    user: "shopsquire"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:latest
    container_name: shopsquire_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./config/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/observability/prometheus_rules.yml:/etc/prometheus/rules/prometheus_rules.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api

  alertmanager:
    image: prom/alertmanager:latest
    container_name: shopsquire_alertmanager
    environment:
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-http://localhost:0/}"
      PAGERDUTY_KEY: "${PAGERDUTY_KEY:-dummy-set-in-env}"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ./config/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    depends_on:
      - prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: shopsquire_grafana
    environment:
      GF_INSTALL_PLUGINS: simpod-json-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-grafana-change-me}"
    ports:
      - "127.0.0.1:3005:3000"
    volumes:
      - ./config/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus

  graph-refresh:
    build: .
    container_name: shopsquire_graph_refresh
    profiles: [graph-refresh]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/shopsquire
      REDIS_URL: redis://default:${REDIS_PASSWORD:-redis-change-me}@redis:6379/0
      CATALOG_REINDEX_ENABLED: "1"
      CATALOG_REINDEX_BATCH_SIZE: "500"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "scripts/index_catalog.py"]
    restart: "no"
    user: "shopsquire"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ── Neo4j — GNN fraud ring detection (profile-gated, not started by default) ──
  # To activate: docker compose --profile neo4j up -d
  # Required for: account_device_ip_ring_hit + shipping_address_clustered signals
  # in fraud_scorer.py. Without it those two signals degrade gracefully to 0.
  # Set FRAUD_GRAPH_NEO4J_ENABLED=1 in .env when running with this profile.
  neo4j:
    image: neo4j:5
    container_name: shopsquire_neo4j
    profiles: [neo4j]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j-change-me}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "1G"
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      retries: 10
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  db-backup:
    image: postgres:16
    container_name: shopsquire_db_backup
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: shopsquire
      BACKUP_DIR: /var/backups/shopsquire
      BACKUP_RETENTION_DAYS: "7"
    volumes:
      - ./scripts/pg_backup.sh:/usr/local/bin/pg_backup.sh:ro
      - db-backups:/var/backups/shopsquire
    depends_on:
      db:
        condition: service_healthy
    # Run daily at 02:00 UTC via a simple sleep loop
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        chmod +x /usr/local/bin/pg_backup.sh
        echo "[db-backup] Running initial backup..."
        /usr/local/bin/pg_backup.sh
        echo "[db-backup] Entering daily schedule (every 86400s)"
        while true; do sleep 86400; /usr/local/bin/pg_backup.sh; done
    restart: unless-stopped
    user: "postgres"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=512M

volumes:
  pgdata:
  db-backups:
  neo4j_data:
  audit-worm:
