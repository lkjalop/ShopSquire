version: "3.9"
services:
  api:
    build: .
    container_name: shopsquire_api
    env_file:
      - .env
    environment:
      INTERNAL_MTLS_REQUIRED: "1"
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
    command: ["uvicorn", "src.app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    user: "shopsquire"
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16
    container_name: shopsquire_db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-change-me}
      POSTGRES_USER: postgres
      POSTGRES_DB: shopsquire
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: shopsquire_redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis-change-me}"]
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    container_name: shopsquire_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./config/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/observability/prometheus_rules.yml:/etc/prometheus/rules/prometheus_rules.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api

  alertmanager:
    image: prom/alertmanager:latest
    container_name: shopsquire_alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ./config/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    depends_on:
      - prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: shopsquire_grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-grafana-change-me}"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./config/observability/grafana/datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./config/observability/grafana/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./config/observability/grafana/dashboards/shopsquire-dashboard.json:/etc/grafana/provisioning/dashboards/shopsquire-dashboard.json:ro
      - ./config/observability/grafana/dashboards/shopsquire-bi-views.json:/etc/grafana/provisioning/dashboards/shopsquire-bi-views.json:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
