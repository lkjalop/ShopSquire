    <title>ShopSquire Admin</title>
    <style>
      body { font-family: Inter, system-ui, sans-serif; margin:0; }
      header { padding: 12px 16px; border-bottom: 1px solid #eee; display:flex; justify-content:space-between; align-items:center; }
      .tabs { display:flex; gap:8px; padding:8px 16px; border-bottom: 1px solid #eee; }
      .tab { padding:8px 12px; border-radius:8px; cursor:pointer; }
      .tab.active { background:#2563eb; color:#fff; }
      .container { padding: 16px; }
      .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
      .card { border:1px solid #e5e7eb; border-radius:8px; padding:12px; }
      .title { font-weight:600; }
      .sub { color:#6b7280; font-size:12px; }
      table { width:100%; border-collapse: collapse; }
      th, td { border-bottom:1px solid #eee; padding:8px; text-align:left; font-size:14px; }
      .actions { display:flex; gap:6px; }
      .btn { padding:6px 10px; border:none; border-radius:6px; background:#2563eb; color:#fff; cursor:pointer; }
      .btn-secondary { padding:6px 10px; border:none; border-radius:6px; background:#f3f4f6; color:#111827; cursor:pointer; }
      .detail { border:1px solid #e5e7eb; border-radius:8px; padding:12px; margin-top:12px; }
      @media (max-width: 1023px) { .grid { grid-template-columns: repeat(2, 1fr); } }
      @media (max-width: 767px) { .grid { grid-template-columns: 1fr; } }
    </style>
